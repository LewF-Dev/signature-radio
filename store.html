<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Signature Radio UK official merchandise — rep the station with tees, hoodies and more." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://signatureradio.uk/store.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Signature Radio UK" />
  <meta property="og:title" content="Store — Signature Radio UK" />
  <meta property="og:description" content="Official Signature Radio UK merchandise. Rep the station." />
  <meta property="og:url" content="https://signatureradio.uk/store.html" />
  <meta property="og:image" content="https://signatureradio.uk/logo.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Store — Signature Radio UK" />
  <meta name="twitter:description" content="Official Signature Radio UK merchandise." />
  <meta name="twitter:image" content="https://signatureradio.uk/logo.jpg" />

  <title>Store — Signature Radio UK</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="ticker-mount"></div>
  <div id="nav-mount"></div>

  <main>
    <section class="section page-section" aria-labelledby="store-heading">
      <div class="container">
        <h1 class="section-heading reveal reveal--left" id="store-heading">STORE</h1>
        <p class="section-intro reveal">Official Signature Radio UK merchandise. Wear the station.</p>

        <!-- Product grid — populated by Printful API -->
        <div class="store-grid" id="storeGrid">
          <!-- Loading state -->
          <div class="store-loading" id="storeLoading">
            <p>Loading products…</p>
          </div>
          <!-- Error / coming-soon fallback -->
          <div class="store-empty" id="storeEmpty" hidden>
            <p>The store is being stocked up. Check back soon.</p>
            <p>In the meantime, email <a href="mailto:info@signatureradio.uk" class="link-red">info@signatureradio.uk</a> for enquiries.</p>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="partials.js"></script>
  <script src="main.js"></script>
  <script src="supabase-config.js"></script>
  <script src="presenter-auth.js"></script>
  <script src="router.js"></script>
  <script src="store.js"></script>
</body>
</html>
